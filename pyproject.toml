[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcl-mcp"
version = "0.3.0"
description = "MCP server del DataCivicLab — contesto org-wide, GitHub Discussions e query sui dati pubblici (GCS)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "lab-connectors[mcp,duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.5",
    "mypy>=1.20",
]

[project.scripts]
dcl-mcp = "dcl_mcp.server:main"

[project.urls]
Repository = "https://github.com/dataciviclab/dcl-mcp"
Issues = "https://github.com/dataciviclab/dcl-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dcl_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=30"
markers = [
    "contract: public interface, artifact format, API contract, tool names",
    "policy: Lab non-obvious rule or cross-component behavior",
    "regression: documented bug fix (link to issue/PR)",
    "adapter: adapter to external service (our wrappers, not library internals)",
    "pure_unit: non-trivial pure logic, zero side effects",
    "smoke: end-to-end golden path only (requires network)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = false
no_implicit_optional = true
ignore_missing_imports = true
